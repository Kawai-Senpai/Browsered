<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="browserd mark">
  <!--
    Three traces of unequal length with a cursor at the head of the live one:
    an event stream still being written.

    Flat fills only. Depth is one surface step (surface-1 tile on a surface-0
    field), never a gradient or a shadow.
  -->

  <rect x="0" y="0" width="128" height="128" rx="12" fill="#1E2126"/>

  <!-- Recorded traces: settled -->
  <rect x="26" y="40" width="46" height="8" rx="4" fill="#8A9199"/>
  <rect x="26" y="88" width="34" height="8" rx="4" fill="#8A9199"/>

  <!-- The live trace, still being written -->
  <rect x="26" y="64" width="60" height="8" rx="4" fill="#26C08A"/>
  <circle cx="94" cy="68" r="9" fill="#26C08A"/>
</svg>
