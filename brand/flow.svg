<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-label="browserd architecture: Chromium pushes CDP events into always-on recorders that persist to SQLite and blobs; the agent queries that store over MCP instead of asking the browser.">
  <title>How browserd works</title>

  <defs>
    <marker id="a-tip" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#26C08A"/>
    </marker>

    <marker id="a-tip-dim" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8A9199"/>
    </marker>
  </defs>

  <rect width="1200" height="560" fill="#16181C"/>

  <!-- ══════════ Recording path: always on ══════════ -->

  <text x="60" y="52"
        font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="11.5" letter-spacing="2" fill="#26C08A">RECORDING PATH — ALWAYS ON</text>

  <!-- Chromium -->
  <rect x="60" y="74" width="212" height="128" rx="2" fill="#1E2126"/>
  <text x="80" y="102"
        font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="14" fill="#DDE1E6">Chromium</text>
  <text x="80" y="122"
        font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="11" fill="#8A9199">headed · yours to use</text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" fill="#8A9199">
    <text x="80" y="146">page · iframe · worker</text>
    <text x="80" y="164">service worker</text>
    <text x="80" y="182">extension context</text>
  </g>

  <!-- CDP push -->
  <path d="M278 138 H352" stroke="#26C08A" stroke-width="1.5" marker-end="url(#a-tip)"/>
  <text x="286" y="130"
        font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="10" fill="#26C08A">CDP events</text>

  <!-- Collectors -->
  <rect x="360" y="74" width="238" height="128" rx="2" fill="#1E2126"/>
  <text x="380" y="102"
        font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="14" fill="#DDE1E6">collectors</text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5">
    <text x="380" y="126" fill="#8A9199">network · console</text>
    <text x="380" y="144" fill="#8A9199">exceptions · navigations</text>
    <text x="380" y="170" fill="#26C08A">subscribed before enable</text>
    <text x="380" y="188" fill="#26C08A">targets held at start</text>
  </g>

  <path d="M604 138 H678" stroke="#26C08A" stroke-width="1.5" marker-end="url(#a-tip)"/>

  <!-- Store -->
  <rect x="686" y="74" width="238" height="128" rx="2" fill="#1E2126"/>
  <text x="706" y="102"
        font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="14" fill="#DDE1E6">store</text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" fill="#8A9199">
    <text x="706" y="126">browserd.db — metadata</text>
    <text x="706" y="144">blobs/ — bodies by sha256</text>
    <text x="706" y="162">artifacts/ — traces, heaps</text>
    <text x="706" y="186" fill="#D99A2B">survives navigation + restart</text>
  </g>

  <!-- The honesty note on recording -->
  <rect x="948" y="74" width="192" height="128" rx="3" fill="#0C0F14" stroke="#31363E" stroke-width="1"/>
  <text x="966" y="100"
        font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="10.5" letter-spacing="1.2" fill="#D99A2B">WHY IT DOES NOT MISS</text>
  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#8A9199">
    <text x="966" y="124">New targets are held at</text>
    <text x="966" y="141">waitForDebuggerOnStart</text>
    <text x="966" y="158">until the recorders are</text>
    <text x="966" y="175">live — so the first</text>
    <text x="966" y="192">navigation is captured.</text>
  </g>

  <!-- ══════════ Query path: on demand ══════════ -->

  <text x="60" y="268"
        font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="11.5" letter-spacing="2" fill="#8A9199">QUERY PATH — ON DEMAND</text>

  <!-- Agent -->
  <rect x="60" y="290" width="212" height="112" rx="2" fill="#1E2126"/>
  <text x="80" y="318"
        font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="14" fill="#DDE1E6">your agent</text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" fill="#8A9199">
    <text x="80" y="342">Claude · Codex · Cursor</text>
    <text x="80" y="360">VS Code · Windsurf</text>
    <text x="80" y="384">stdio or HTTP</text>
  </g>

  <path d="M278 346 H352" stroke="#8A9199" stroke-width="1.5" marker-end="url(#a-tip-dim)"/>
  <text x="290" y="338"
        font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="10" fill="#8A9199">MCP</text>

  <!-- Tool surface -->
  <rect x="360" y="290" width="238" height="112" rx="2" fill="#1E2126"/>
  <text x="380" y="318"
        font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="14" fill="#DDE1E6">174 tools</text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" fill="#8A9199">
    <text x="380" y="342">page · dom · css · js</text>
    <text x="380" y="360">network · console · debugger</text>
    <text x="380" y="378">storage · profiler · time · fault</text>
  </g>

  <!-- Split: queries hit the store, actions hit the browser -->
  <path d="M604 330 H678" stroke="#8A9199" stroke-width="1.5" marker-end="url(#a-tip-dim)"/>
  <text x="612" y="322"
        font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="9.5" fill="#8A9199">reads</text>

  <path d="M478 410 V438 H34 V138 H52" stroke="#8A9199" stroke-width="1.5"
        stroke-dasharray="4 4" fill="none" marker-end="url(#a-tip-dim)"/>
  <text x="492" y="436"
        font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="9.5" fill="#8A9199">actions — click, type, evaluate, breakpoint — go straight to the browser</text>

  <!-- Answers -->
  <rect x="686" y="290" width="454" height="112" rx="2" fill="#1E2126"/>
  <text x="706" y="318"
        font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="14" fill="#DDE1E6">answers, not dumps</text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5">
    <text x="706" y="342" fill="#8A9199">a 700 kB body returns</text>
    <text x="890" y="342" fill="#26C08A">an artifact handle + 500 chars</text>
    <text x="706" y="360" fill="#8A9199">read it with</text>
    <text x="890" y="360" fill="#DDE1E6">artifact.search · json_query</text>
    <text x="706" y="378" fill="#8A9199">history survives</text>
    <text x="890" y="378" fill="#DDE1E6">navigation · tab close · restart</text>
  </g>

  <!-- ══════════ The point ══════════ -->
  <rect x="60" y="470" width="1080" height="58" rx="2" fill="#1E2126"/>
  <rect x="60" y="470" width="3" height="58" fill="#26C08A"/>
  <text x="86" y="496"
        font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="11" letter-spacing="1.4" fill="#26C08A">RECORD FIRST · QUERY LATER</text>
  <text x="86" y="516"
        font-family="ui-sans-serif, system-ui, sans-serif"
        font-size="13.5" fill="#8A9199">Ask a normal browser-automation MCP why checkout failed and it has nothing — the request is gone. browserd has the payload, the response body, the console error and the source line.</text>
</svg>
